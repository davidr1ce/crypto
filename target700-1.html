<!DOCTYPE html>
<html lang="en">

<script>
(async function() {
  const HASH = '264f43aead1087b9bb6117cf1d3c778dd24bfc738d77f141debdae4ac2fae215';
  const stored = sessionStorage.getItem('t700_auth');
  if (stored === HASH) return; // already authenticated this session

  const pw = prompt('🔒 Target $700 — Şifre:');
  if (!pw) { window.location.href = '/index.html'; return; }

  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  const hash = [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('');

  if (hash === HASH) {
    sessionStorage.setItem('t700_auth', HASH);
  } else {
    alert('Yanlış şifre.');
    window.location.href = '/index.html';
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --bg: #08090c;
    --surface: #10131a;
    --border: rgba(255,255,255,0.07);
    --text: #e8eaf0;
    --muted: #6b7280;
    --accent: #f0b429;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Syne', sans-serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(240,180,41,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240,180,41,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(110px);
    opacity: .18;
    pointer-events: none;
    z-index: 0;
  }
  .orb-1 { width: 520px; height: 520px; background: #f0b429; top: -160px; right: -160px; }
  .orb-2 { width: 400px; height: 400px; background: #6366f1; bottom: -120px; left: -120px; }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }

  /* ── Back button ── */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Space Mono', monospace;
    font-size: .7rem;
    color: var(--muted);
    text-decoration: none;
    margin-bottom: 36px;
    transition: color .2s;
  }
  .back-btn:hover { color: var(--text); }

  /* ── Header ── */
  header { text-align: center; margin-bottom: 40px; }

  .avatar-ring {
    width: 80px; height: 80px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    font-weight: 800;
    color: #fff;
  }

  h1 {
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    background: linear-gradient(90deg, #fff 30%, #22c55e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }

  .tagline {
    font-family: 'Space Mono', monospace;
    font-size: .78rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* ── Progress bar ── */
  .progress-banner {
    background: linear-gradient(135deg, rgba(34,197,94,0.1), rgba(99,102,241,0.06));
    border: 1px solid rgba(34,197,94,0.2);
    border-radius: 20px;
    padding: 24px 28px;
    margin-bottom: 24px;
    animation: fadeUp .5s ease .05s both;
  }

  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .progress-label {
    font-family: 'Space Mono', monospace;
    font-size: .7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .12em;
    margin-bottom: 4px;
  }

  .progress-total {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #22c55e;
    line-height: 1;
  }

  .progress-target {
    font-family: 'Space Mono', monospace;
    font-size: .75rem;
    color: var(--muted);
    text-align: right;
  }

  .progress-bar-track {
    background: rgba(255,255,255,0.06);
    border-radius: 99px;
    height: 8px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #22c55e, #86efac);
    transition: width 1s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }

  .progress-pct {
    font-family: 'Space Mono', monospace;
    font-size: .7rem;
    color: #22c55e;
    text-align: right;
  }

  /* ── Portfolio meta row ── */
  .meta-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
  }

  .refresh-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: .65rem;
    padding: 7px 12px;
    cursor: pointer;
    transition: color .2s, border-color .2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .refresh-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

  .last-updated {
    font-family: 'Space Mono', monospace;
    font-size: .6rem;
    color: var(--muted);
  }

  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Coin cards ── */
  .cards { display: flex; flex-direction: column; gap: 16px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    transition: border-color .25s, transform .25s, box-shadow .25s;
  }
  .card:hover {
    border-color: rgba(34,197,94,0.2);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
  }

  .card-top {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 22px;
    cursor: pointer;
  }

  .coin-logo {
    width: 48px; height: 48px;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .coin-logo svg { width: 100%; height: 100%; display: block; }

  .coin-info { flex: 1; min-width: 0; }

  .coin-name-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 3px;
  }

  .coin-name { font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; }
  .coin-ticker { color: var(--muted); font-size: .78rem; font-weight: 400; }
  .coin-balance-usd {
    font-family: 'Space Mono', monospace;
    font-size: .82rem;
    font-weight: 700;
    color: #22c55e;
    white-space: nowrap;
  }

  .coin-bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .coin-addr {
    font-family: 'Space Mono', monospace;
    font-size: .67rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }

  .coin-balance-crypto {
    font-family: 'Space Mono', monospace;
    font-size: .67rem;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .skel {
    display: inline-block;
    width: 70px; height: 12px;
    border-radius: 6px;
    background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    vertical-align: middle;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .card-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .btn {
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: .78rem;
    padding: 8px 14px;
    transition: opacity .2s, transform .15s;
  }
  .btn:hover { opacity: .85; transform: scale(0.97); }
  .btn:active { transform: scale(0.93); }

  .btn-copy {
    background: rgba(255,255,255,0.06);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-qr {
    background: #22c55e;
    color: #fff;
  }

  /* QR panel */
  .qr-panel {
    max-height: 0;
    overflow: hidden;
    transition: max-height .4s cubic-bezier(.4,0,.2,1);
  }
  .qr-panel.open { max-height: 260px; }

  .qr-inner {
    border-top: 1px solid var(--border);
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .qr-box {
    background: #fff;
    border-radius: 10px;
    padding: 8px;
    flex-shrink: 0;
  }

  .qr-meta { flex: 1; min-width: 160px; }
  .qr-meta .label {
    font-family: 'Space Mono', monospace;
    font-size: .65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .1em;
    margin-bottom: 8px;
  }
  .qr-meta .full-addr {
    font-family: 'Space Mono', monospace;
    font-size: .65rem;
    color: var(--text);
    word-break: break-all;
    line-height: 1.6;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #fff;
    color: #08090c;
    font-weight: 700;
    font-size: .85rem;
    padding: 11px 22px;
    border-radius: 40px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer {
    text-align: center;
    margin-top: 56px;
    font-family: 'Space Mono', monospace;
    font-size: .65rem;
    color: var(--muted);
    letter-spacing: .08em;
  }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(24px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .card { animation: fadeUp .5s ease both; }
  .card:nth-child(1) { animation-delay: .1s; }
  .card:nth-child(2) { animation-delay: .2s; }
  .card:nth-child(3) { animation-delay: .3s; }
  .card:nth-child(4) { animation-delay: .4s; }
  header { animation: fadeUp .5s ease .05s both; }
</style>
</head>

<div class="wrapper">

  <header>

  <!-- Progress Banner -->
  <div class="progress-banner">
    <div class="progress-top">
      <div>

<div class="toast" id="toast">✓ Address copied!</div>

<script>
const TARGET = 700;
const HELIUS_RPC = 'https://mainnet.helius-rpc.com/?api-key=2958926e-797c-4596-bd14-473b7d4c1c6c';
const REFRESH_INTERVAL = 30 * 60 * 1000;

const COINS = [
  {
    id: 'sol', name: 'Solana', ticker: 'SOL',
    addr: '4dCTAPWdJf4ipnQdFn3zGq7BHuGgXHoRjwiqvL93ry7S',
    bg: '#1a0e2e',
    svg: `<svg viewBox="0 0 397.7 311.7" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="s2a" x1="360.9" y1="351.5" x2="141.2" y2="-69.2" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#00ffa3"/><stop offset="1" stop-color="#dc1fff"/>
        </linearGradient>
        <linearGradient id="s2b" x1="264.8" y1="401.6" x2="45.1" y2="-19.1" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#00ffa3"/><stop offset="1" stop-color="#dc1fff"/>
        </linearGradient>
        <linearGradient id="s2c" x1="312.5" y1="376.7" x2="92.8" y2="-44" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#00ffa3"/><stop offset="1" stop-color="#dc1fff"/>
        </linearGradient>
      </defs>
      <path d="M64.6 237.9c2.4-2.4 5.7-3.8 9.2-3.8h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7c-2.4 2.4-5.7 3.8-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1z" fill="url(#s2a)"/>
      <path d="M64.6 3.8C67.1 1.4 70.4 0 73.8 0h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7c-2.4 2.4-5.7 3.8-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1z" fill="url(#s2b)"/>
      <path d="M333.1 120.1c-2.4-2.4-5.7-3.8-9.2-3.8H6.5c-5.8 0-8.7 7-4.6 11.1l62.7 62.7c2.4 2.4 5.7 3.8 9.2 3.8h317.4c5.8 0 8.7-7 4.6-11.1z" fill="url(#s2c)"/>
    </svg>`
  },
  {
    id: 'ltc', name: 'Litecoin', ticker: 'LTC',
    addr: 'LRAr8a8DRZc7wwRpV6xEGWKacy9vSRUB2R',
    bg: '#1a1a1a',
    svg: `<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="16" fill="#BFBBBB"/>
      <path d="M10 5h4.5l-2 8.2 2.3-.8-.7 2.8-2.3.8L10.5 27H22l1-4.5H14l1.2-4.7 2.3-.8.7-2.8-2.3.8L18.5 5z" fill="#fff"/>
    </svg>`
  },
  {
    id: 'eth', name: 'Ethereum', ticker: 'ETH',
    addr: '0x00dF41F558e0837E3ce28602AC4E40cA6aF726cC',
    bg: '#0d1129',
    svg: `<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="16" fill="#627EEA"/>
      <path d="M16.498 4v8.87l7.497 3.35z" fill="#fff" fill-opacity=".602"/>
      <path d="M16.498 4L9 16.22l7.498-3.35z" fill="#fff"/>
      <path d="M16.498 21.968v6.027L24 17.616z" fill="#fff" fill-opacity=".602"/>
      <path d="M16.498 27.995v-6.028L9 17.616z" fill="#fff"/>
      <path d="M16.498 20.573l7.497-4.353-7.497-3.348z" fill="#fff" fill-opacity=".2"/>
      <path d="M9 16.22l7.498 4.353v-7.701z" fill="#fff" fill-opacity=".602"/>
    </svg>`
  },
  {
    id: 'trx', name: 'TRON', ticker: 'TRX',
    addr: 'TAmb7mXds99jRUacS8YC5ntn6Q9xytky6e',
    bg: '#1a0005',
    svg: `<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="16" fill="#EF0027"/>
      <path d="M23.5 10.2L8.3 7l9.4 17.4 7.5-12.5-1.7-1.7zm-2.4 1l-5.3 8.9-6.3-11.6 11.6 2.7z" fill="#fff"/>
    </svg>`
  }
];

/* Render cards */
const container = document.getElementById('cards');
COINS.forEach(coin => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-top">
      <div class="coin-logo" style="background:${coin.bg}">${coin.svg}</div>
      <div class="coin-info">
        <div class="coin-name-row">
          <span class="coin-name">${coin.name} <span class="coin-ticker">${coin.ticker}</span></span>
          <span class="coin-balance-usd" id="bal-usd-${coin.id}"><span class="skel"></span></span>
        </div>
        <div class="coin-bottom-row">
          <span class="coin-addr">${coin.addr}</span>
          <span class="coin-balance-crypto" id="bal-crypto-${coin.id}"></span>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn btn-copy" onclick="copyAddr('${coin.addr}', event)">Copy</button>
        <button class="btn btn-qr" onclick="toggleQR('${coin.id}', event)">QR</button>
      </div>
    </div>
    <div class="qr-panel" id="qr-panel-${coin.id}">
      <div class="qr-inner">
        <div class="qr-box" id="qr-${coin.id}"></div>
        <div class="qr-meta">
          <div class="label">${coin.name} Address</div>
          <div class="full-addr">${coin.addr}</div>
        </div>
      </div>
    </div>
  `;
  container.appendChild(card);
});

/* Prices */
let prices = {};
let balances = {};

async function fetchPrices() {
  const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=solana,litecoin,ethereum,tron&vs_currencies=usd');
  const d = await r.json();
  prices = { sol: d.solana?.usd||0, ltc: d.litecoin?.usd||0, eth: d.ethereum?.usd||0, trx: d.tron?.usd||0 };
}

async function fetchSOL(addr) {
  const r = await fetch(HELIUS_RPC, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({jsonrpc:'2.0',id:1,method:'getBalance',params:[addr]})
  });
  const d = await r.json();
  return (d.result?.value||0)/1e9;
}

async function fetchETH(addr) {
  const r = await fetch(`https://api.blockchair.com/ethereum/dashboards/address/${addr}`);
  const d = await r.json();
  return (d.data?.[addr.toLowerCase()]?.address?.balance||0)/1e18;
}

async function fetchLTC(addr) {
  const r = await fetch(`https://api.blockcypher.com/v1/ltc/main/addrs/${addr}/balance`);
  const d = await r.json();
  return (d.balance||0)/1e8;
}

async function fetchTRX(addr) {
  const r = await fetch(`https://api.trongrid.io/v1/accounts/${addr}`);
  const d = await r.json();
  return (d.data?.[0]?.balance||0)/1e6;
}

function updateProgress(total) {
  const pct = Math.min((total / TARGET) * 100, 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = '%' + pct.toFixed(1);
  const totalEl = document.getElementById('total-usd');
  totalEl.textContent = '$' + total.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function updateCoinUI(id, amount) {
  const price = prices[id]||0;
  const usd = amount * price;
  const ticker = COINS.find(c=>c.id===id).ticker;
  document.getElementById(`bal-usd-${id}`).textContent = '$' + usd.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById(`bal-crypto-${id}`).textContent = amount.toFixed(6)+' '+ticker;
  balances[id] = usd;
  const total = Object.values(balances).reduce((a,b)=>a+b,0);
  updateProgress(total);
}

async function fetchAllBalances() {
  const btn = document.getElementById('refresh-btn');
  const icon = document.getElementById('refresh-icon');
  icon.className = 'spin'; icon.textContent = '↻';
  btn.disabled = true;
  try {
    await fetchPrices();
    const [sol,eth,ltc,trx] = await Promise.allSettled([
      fetchSOL(COINS[0].addr),
      fetchETH(COINS[2].addr),
      fetchLTC(COINS[1].addr),
      fetchTRX(COINS[3].addr)
    ]);
    if(sol.status==='fulfilled') updateCoinUI('sol',sol.value);
    if(eth.status==='fulfilled') updateCoinUI('eth',eth.value);
    if(ltc.status==='fulfilled') updateCoinUI('ltc',ltc.value);
    if(trx.status==='fulfilled') updateCoinUI('trx',trx.value);
    const now = new Date();
    document.getElementById('last-updated').textContent =
      'Updated ' + now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  } catch(e) { console.error(e); }
  icon.className=''; icon.textContent='↻'; btn.disabled=false;
}

fetchAllBalances();
setInterval(fetchAllBalances, REFRESH_INTERVAL);

/* QR */
const qrGenerated = {};
function toggleQR(id, e) {
  e.stopPropagation();
  const panel = document.getElementById(`qr-panel-${id}`);
  const isOpen = panel.classList.contains('open');
  document.querySelectorAll('.qr-panel').forEach(p=>p.classList.remove('open'));
  if (!isOpen) {
    panel.classList.add('open');
    if (!qrGenerated[id]) {
      const coin = COINS.find(c=>c.id===id);
      new QRCode(document.getElementById(`qr-${id}`),{
        text:coin.addr, width:150, height:150,
        colorDark:'#111', colorLight:'#fff',
        correctLevel: QRCode.CorrectLevel.M
      });
      qrGenerated[id]=true;
    }
  }
}

/* Copy */
const toast = document.getElementById('toast');
let toastTimer;
function copyAddr(addr, e) {
  if(e) e.stopPropagation();
  if(navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(addr).catch(()=>fallbackCopy(addr));
  } else { fallbackCopy(addr); }
  clearTimeout(toastTimer);
  toast.classList.add('show');
  toastTimer = setTimeout(()=>toast.classList.remove('show'), 1800);
}
function fallbackCopy(addr) {
  const el = document.createElement('textarea');
  el.value = addr;
  el.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0';
  document.body.appendChild(el);
  el.focus(); el.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(el);
}
</script>
