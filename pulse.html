<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Pulse — davidrice.online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E1220;
    --panel: #151B2E;
    --panel-hover: #1B2340;
    --line: #232C4A;
    --text: #E7EAF4;
    --dim: #7C87A6;
    --brass: #E4B95B;
    --up: #4ADE9C;
    --down: #F2637E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
    padding: 28px 20px 48px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }

  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 3px;
    color: var(--brass); text-transform: uppercase;
  }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; margin-top: 6px; }
  #refresh {
    background: var(--panel); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 8px 16px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; cursor: pointer;
    transition: opacity .15s ease;
  }
  #refresh:hover { opacity: .85; }
  #refresh:disabled { cursor: wait; opacity: .6; }

  #error {
    display: none;
    background: #3A1A24; border: 1px solid var(--down);
    border-radius: 12px; padding: 16px; margin-bottom: 20px; font-size: 14px;
  }

  /* Hero */
  #hero {
    background: linear-gradient(135deg, var(--panel) 0%, var(--bg) 100%);
    border: 1px solid var(--line); border-radius: 18px;
    padding: 22px 24px 12px; margin-bottom: 22px;
    animation: rise .4s ease-out;
  }
  .hero-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .hero-name { display: flex; align-items: center; gap: 10px; }
  .hero-name img { width: 28px; height: 28px; border-radius: 50%; }
  .hero-name .n { font-size: 18px; font-weight: 700; }
  .hero-name .s { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--dim); }
  .hero-price {
    font-family: 'JetBrains Mono', monospace;
    font-size: 38px; font-weight: 600; margin-top: 10px; letter-spacing: -1px;
  }
  .hero-right { text-align: right; font-family: 'JetBrains Mono', monospace; }
  .hero-change { font-size: 20px; font-weight: 600; }
  .hero-sub { font-size: 11px; color: var(--dim); margin-top: 6px; }
  .hero-cap { font-size: 12px; color: var(--dim); margin-top: 10px; }
  .hero-foot {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--dim); text-align: right; padding: 4px 2px 8px;
  }

  /* Rows */
  #list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: grid;
    grid-template-columns: minmax(90px,1fr) minmax(80px,110px) 1.4fr minmax(70px,90px);
    align-items: center; gap: 14px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 16px;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease;
    animation: rise .4s ease-out both;
  }
  .row:hover { background: var(--panel-hover); transform: translateX(3px); }
  .row:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .row.sel { background: var(--panel-hover); }
  .coin { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .coin img { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; }
  .coin .n { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .coin .s { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--dim); }
  .price { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; text-align: right; }
  .chg { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; text-align: right; }
  .up { color: var(--up); }
  .down { color: var(--down); }

  footer {
    margin-top: 20px; font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--dim);
    display: flex; justify-content: space-between;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; } }
  @media (max-width: 520px) {
    .row { grid-template-columns: 1fr auto auto; }
    .row svg { display: none; }
    .hero-price { font-size: 30px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Canlı Piyasa · CoinGecko</div>
      <h1>Crypto Pulse</h1>
    </div>
    <button id="refresh">↻ yenile</button>
  </header>

  <div id="error"></div>
  <section id="hero" hidden></section>
  <section id="list"></section>

  <footer>
    <span>bir coine tıkla → detay</span>
    <span id="updated"></span>
  </footer>
</div>

<script>
// ── Coin listesi: cüzdan sayfandakiyle aynı beşli ──────────────
const COINS = [
  { id: "bitcoin",  sym: "BTC", hue: "#F7931A" },
  { id: "ethereum", sym: "ETH", hue: "#8A9CF5" },
  { id: "solana",   sym: "SOL", hue: "#9A6CF0" },
  { id: "litecoin", sym: "LTC", hue: "#8FA6B8" },
  { id: "tron",     sym: "TRX", hue: "#EF4B4B" },
];

let data = null;
let sel = "bitcoin";

// ── Biçimlendiriciler ──────────────────────────────────────────
const fmtUsd = n =>
  n >= 1000 ? "$" + n.toLocaleString("en-US", { maximumFractionDigits: 0 })
  : n >= 1  ? "$" + n.toLocaleString("en-US", { maximumFractionDigits: 2 })
  :           "$" + n.toLocaleString("en-US", { maximumFractionDigits: 4 });

const fmtBig = n => {
  if (n >= 1e12) return "$" + (n / 1e12).toFixed(2) + "T";
  if (n >= 1e9)  return "$" + (n / 1e9).toFixed(1) + "B";
  if (n >= 1e6)  return "$" + (n / 1e6).toFixed(1) + "M";
  return "$" + Math.round(n).toLocaleString();
};

// ── SVG sparkline üretici ──────────────────────────────────────
function spark(points, color, w, h, animate) {
  if (!points || points.length < 2) return "";
  const min = Math.min(...points), max = Math.max(...points);
  const range = max - min || 1;
  const step = w / (points.length - 1);
  const d = points.map((p, i) =>
    (i === 0 ? "M" : "L") + (i * step).toFixed(1) + "," +
    (h - ((p - min) / range) * (h - 6) - 3).toFixed(1)
  ).join(" ");
  const lastY = h - ((points[points.length - 1] - min) / range) * (h - 6) - 3;
  const gid = "g" + color.slice(1) + w;
  const anim = animate
    ? `style="stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s ease-out forwards"` : "";
  const pulse = animate ? `
    <circle cx="${w}" cy="${lastY}" r="3.5" fill="${color}">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>` : "";
  return `
  <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;width:100%">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".25"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${d} L${w},${h} L0,${h} Z" fill="url(#${gid})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" ${anim}/>
    ${pulse}
  </svg>`;
}

// ── Render ────────────────────────────────────────────────────
function renderHero() {
  const c = data.find(x => x.id === sel);
  const m = COINS.find(x => x.id === sel);
  const up = c.price_change_percentage_24h >= 0;
  const hero = document.getElementById("hero");
  hero.hidden = false;
  hero.style.animation = "none";
  void hero.offsetWidth; // animasyonu yeniden tetikle
  hero.style.animation = "";
  hero.innerHTML = `
    <div class="hero-top">
      <div>
        <div class="hero-name">
          <img src="${c.image}" alt="">
          <span class="n">${c.name}</span>
          <span class="s">${m.sym}</span>
        </div>
        <div class="hero-price">${fmtUsd(c.current_price)}</div>
      </div>
      <div class="hero-right">
        <div class="hero-change ${up ? "up" : "down"}">
          ${up ? "▲" : "▼"} ${Math.abs(c.price_change_percentage_24h).toFixed(2)}%
        </div>
        <div class="hero-sub">24 saat</div>
        <div class="hero-cap">Piyasa değeri ${fmtBig(c.market_cap)}</div>
      </div>
    </div>
    <div style="margin-top:8px">
      ${spark(c.sparkline_in_7d?.price, m.hue, 700, 90, true)}
      <div class="hero-foot">son 7 gün</div>
    </div>`;
}

function renderList() {
  const list = document.getElementById("list");
  list.innerHTML = data.map((c, i) => {
    const m = COINS.find(x => x.id === c.id);
    const up = c.price_change_percentage_24h >= 0;
    const pts = c.sparkline_in_7d?.price?.filter((_, j) => j % 4 === 0);
    return `
    <div class="row ${c.id === sel ? "sel" : ""}" role="button" tabindex="0"
         data-id="${c.id}"
         style="animation-delay:${i * .06}s; border-color:${c.id === sel ? m.hue + "55" : "var(--line)"}">
      <div class="coin">
        <img src="${c.image}" alt="">
        <div><div class="n">${c.name}</div><div class="s">${m.sym}</div></div>
      </div>
      <div class="price">${fmtUsd(c.current_price)}</div>
      <div style="height:36px">${spark(pts, m.hue, 220, 36, false)}</div>
      <div class="chg ${up ? "up" : "down"}">${up ? "+" : ""}${c.price_change_percentage_24h?.toFixed(2)}%</div>
    </div>`;
  }).join("");

  list.querySelectorAll(".row").forEach(row => {
    const pick = () => { sel = row.dataset.id; renderHero(); renderList(); };
    row.addEventListener("click", pick);
    row.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  });
}

// ── Veri çekme ────────────────────────────────────────────────
async function load() {
  const btn = document.getElementById("refresh");
  const errBox = document.getElementById("error");
  btn.disabled = true; btn.textContent = "yükleniyor…";
  errBox.style.display = "none";
  try {
    const ids = COINS.map(c => c.id).join(",");
    const res = await fetch(
      `https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids}&sparkline=true&price_change_percentage=24h`
    );
    if (!res.ok) throw new Error("API " + res.status);
    const json = await res.json();
    const order = Object.fromEntries(COINS.map((c, i) => [c.id, i]));
    json.sort((a, b) => order[a.id] - order[b.id]);
    data = json;
    renderHero();
    renderList();
    document.getElementById("updated").textContent =
      "güncellendi " + new Date().toLocaleTimeString() + " · 60 sn'de bir otomatik yenilenir";
  } catch (e) {
    errBox.style.display = "block";
    errBox.textContent = `Veri alınamadı (${e.message}). CoinGecko bazen hız sınırı uygular — birkaç saniye sonra "yenile"ye bas.`;
  } finally {
    btn.disabled = false; btn.textContent = "↻ yenile";
  }
}

document.getElementById("refresh").addEventListener("click", load);
load();
setInterval(load, 60000);
</script>
</body>
</html>
